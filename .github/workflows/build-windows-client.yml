name: Windows client
on:
  workflow_dispatch:
  push:
    paths: ['apps/windows/**', 'packages/remote-*/**', 'assets/**', 'scripts/build-windows-client.ps1', 'scripts/build-native.ps1', 'scripts/prepare-native.ps1', 'scripts/package-windows-client.py', 'deploy/windows/**', 'upstream/**', '.github/workflows/build-windows-client.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-2025
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: '3.13'
      - uses: msys2/setup-msys2@3c51bf698df1e37b2261f53cb67797b97761185c
        id: msys
        with:
          msystem: UCRT64
          path-type: inherit
          update: true
          location: .tools/msys2
          install: >-
            git make perl
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
      - name: Build and package Windows client
        shell: pwsh
        run: |
          python -m pip install cryptography==48.0.0
          ./scripts/build-windows-client.ps1 -Toolchain '${{ steps.msys.outputs.msys2-location }}/ucrt64' -Python (Get-Command python).Source
      - name: Preserve Windows outputs and logs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: windows-client-${{ github.sha }}
          path: |
            dist/windows-client/
            .cache/*windows*.log
          if-no-files-found: error
