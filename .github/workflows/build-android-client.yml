name: Android client
on:
  workflow_dispatch:
  push:
    paths: ['apps/android/**', 'mobile/**', 'internal/client/**', 'packages/remote-*/**', 'scripts/build-android-client.py', 'scripts/prepare-mobile-inputs.py', 'upstream/**', '.github/workflows/build-android-client.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.27.4'
          cache: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
      - name: Build APK, VPN and native remote libraries
        run: python3 -B scripts/build-android-client.py
      - name: Preserve Android outputs and diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: android-client-${{ github.sha }}
          path: |
            dist/android-client/
            apps/android/app/build/reports/
          if-no-files-found: error
