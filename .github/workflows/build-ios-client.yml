name: iOS client
on:
  workflow_dispatch:
  push:
    paths: ['apps/apple/**', 'mobile/**', 'internal/client/**', 'packages/remote-*/**', 'scripts/build-ios-client.py', 'scripts/apple_*.py', 'upstream/**', '.github/workflows/build-ios-client.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with: {go-version: '1.27.4', cache: false}
      - name: Build unsigned device and simulator clients
        run: |
          python3 -B scripts/build-ios-client.py --sdk iphonesimulator
          python3 -B scripts/build-ios-client.py --sdk iphoneos
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with: {name: 'ios-client-${{ github.sha }}', path: dist/ios-client/, if-no-files-found: error}
