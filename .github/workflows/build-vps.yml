name: VPS auxiliary node
run-name: ${{ github.workflow }} · ${{ inputs.version || 'VERSION默认' }} · ${{ inputs.architecture || 'amd64' }}
on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号（不带 v；留空使用仓库 VERSION）'
        type: string
        default: ''
      architecture:
        description: '当前支持的目标架构'
        type: choice
        default: amd64
        options: [amd64, arm64]
      publish:
        description: '构建通过后发布到 Releases'
        type: boolean
        default: false
      release_type:
        description: 'Release 类型（同版本各平台请保持一致）'
        type: choice
        default: prerelease
        options: [draft, prerelease, stable]
  push:
    paths: ['VERSION', 'scripts/build_config.py', 'scripts/linux_arch.py', 'scripts/ci_metadata.py', 'scripts/stage-release.py', 'scripts/publish-release.py', 'scripts/cmake/**', 'install-vps.sh', 'cmd/netgo-vpsctl/**', 'go.mod', 'go.sum', 'deploy/linux/**', 'internal/model/**', 'internal/gateway/**', 'internal/securefile/**', 'internal/node/**', 'internal/platform/**', 'internal/deployment/**', 'internal/site/**', 'deploy/templates/**', 'scripts/runtime_files.py', 'scripts/bootstrap-vps.sh', 'scripts/build-vps.sh', 'scripts/package-vps.py', 'upstream/**', '.github/workflows/build-vps.yml']
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.meta.outputs.version }}
      arch: ${{ steps.meta.outputs.arch }}
      publish: ${{ steps.meta.outputs.publish }}
      release_type: ${{ steps.meta.outputs.release_type }}
      sdk: ${{ steps.meta.outputs.sdk }}
      version_code: ${{ steps.meta.outputs.version_code }}
      build_number: ${{ steps.meta.outputs.build_number }}
      artifact_name: ${{ steps.meta.outputs.artifact_name }}
      release_artifact: ${{ steps.meta.outputs.release_artifact }}
    env:
      NETGO_REQUESTED_VERSION: ${{ inputs.version }}
      NETGO_REQUESTED_ARCH: ${{ inputs.architecture }}
      NETGO_PUBLISH: ${{ inputs.publish || false }}
      NETGO_RELEASE_TYPE: ${{ inputs.release_type || 'prerelease' }}
      NETGO_IOS_SDK: 'none'
      NETGO_VERSION_CODE: '1'
      NETGO_BUILD_NUMBER: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - id: meta
        name: Validate version, architecture and publishing settings
        run: python3 -B scripts/ci_metadata.py --target vps
  build:
    needs: prepare
    env:
      NETGO_PUBLISH: ${{ needs.prepare.outputs.publish }}
      NETGO_RELEASE_TYPE: ${{ needs.prepare.outputs.release_type }}
      NETGO_VERSION: ${{ needs.prepare.outputs.version }}
      NETGO_ARCH: ${{ needs.prepare.outputs.arch }}
      NETGO_IOS_SDK: ${{ needs.prepare.outputs.sdk }}
      NETGO_VERSION_CODE: ${{ needs.prepare.outputs.version_code }}
      NETGO_BUILD_NUMBER: ${{ needs.prepare.outputs.build_number }}
    runs-on: ${{ needs.prepare.outputs.arch == 'arm64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    container: debian:13
    timeout-minutes: 90
    steps:
      - name: Prepare Debian environment
        run: apt-get update && apt-get install -y git ca-certificates curl python3 python3-cryptography build-essential
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Verify deployment boundary and ownership
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          CGO_ENABLED=0 go test ./internal/node ./internal/deployment -v
      - name: Build VPS auxiliary package
        run: bash scripts/build-vps.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ needs.prepare.outputs.artifact_name }}
          path: dist/vps-package/
          if-no-files-found: error

      - name: Stage verified runtime assets for optional release
        run: python3 -B scripts/stage-release.py --target vps
      - name: Preserve release payload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ${{ needs.prepare.outputs.release_artifact }}
          path: dist/release-payload/
          if-no-files-found: error
  publish:
    needs: [prepare, build]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.prepare.outputs.publish == 'true' }}
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      NETGO_PUBLISH: 'true'
      NETGO_RELEASE_TYPE: ${{ needs.prepare.outputs.release_type }}
      NETGO_RELEASE_ARTIFACT: ${{ needs.prepare.outputs.release_artifact }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Publish this platform to the selected Release
        run: python3 -B scripts/publish-release.py
