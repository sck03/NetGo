name: VPS auxiliary node
on:
  workflow_dispatch:
  push:
    paths: ['install-vps.sh', 'cmd/netgo-vpsctl/**', 'internal/node/**', 'internal/deployment/**', 'internal/site/**', 'deploy/templates/**', 'scripts/runtime_files.py', 'scripts/bootstrap-vps.sh', 'scripts/build-vps.sh', 'scripts/package-vps.py', 'upstream/**', '.github/workflows/build-vps.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    container: debian:13
    timeout-minutes: 90
    steps:
      - name: Prepare Debian environment
        run: apt-get update && apt-get install -y git ca-certificates curl python3 python3-cryptography build-essential
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5
        with:
          go-version: '1.27.4'
          cache: false
      - name: Verify deployment boundary and ownership
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          CGO_ENABLED=0 go test ./internal/node ./internal/deployment -v
      - name: Build VPS auxiliary package
        run: bash scripts/build-vps.sh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: vps-auxiliary-${{ github.sha }}
          path: dist/vps-package/
          if-no-files-found: error
